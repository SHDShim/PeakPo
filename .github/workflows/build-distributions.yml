name: Build distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  python-distributions:
    name: Python distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bundling/requirements-build.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bundling/requirements-build.txt

      - name: Read package version
        id: version
        shell: python
        run: |
          import os
          import runpy
          version = runpy.run_path("peakpo/version.py")["__version__"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"value={version}\n")

      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python -c "import os; expected = 'v' + os.environ['PACKAGE_VERSION']; actual = os.environ['RELEASE_TAG']; assert actual == expected, f'tag {actual!r} does not match package version {expected!r}'"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate Python distributions
        run: python -m twine check dist/peakpo-${{ steps.version.outputs.value }}*

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/peakpo-${{ steps.version.outputs.value }}.tar.gz
            dist/peakpo-${{ steps.version.outputs.value }}-py3-none-any.whl
          if-no-files-found: error
          retention-days: 30

  standalone-executables:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
            artifact: linux-x86_64
          - label: Windows x86_64
            os: windows-2025
            artifact: windows-x86_64
          - label: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            artifact: macos-x86_64
            archflags: "-arch x86_64"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            setup.py
            bundling/requirements-build.txt
            bundling/constraints-frozen.txt

      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-xkb1

      - name: Install PeakPo and build tools
        env:
          ARCHFLAGS: ${{ matrix.archflags }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r bundling/requirements-build.txt -c bundling/constraints-frozen.txt

      - name: Read package version
        id: version
        shell: python
        run: |
          import os
          import runpy
          version = runpy.run_path("peakpo/version.py")["__version__"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"value={version}\n")

      - name: Build standalone application
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          QT_QPA_PLATFORM: offscreen
        run: python -m PyInstaller --clean --noconfirm bundling/peakpo.spec

      - name: Smoke-test Linux executable
        if: runner.os == 'Linux'
        run: |
          test "$(dist/PeakPo/PeakPo --version)" = "${{ steps.version.outputs.value }}"
          dist/PeakPo/PeakPo --verify-rendering

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/PeakPo/PeakPo.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "PeakPo --version exited with code $($process.ExitCode)"
          }
          $renderProcess = Start-Process -FilePath "dist/PeakPo/PeakPo.exe" -ArgumentList "--verify-rendering" -Wait -PassThru
          if ($renderProcess.ExitCode -ne 0) {
            throw "PeakPo rendering verification exited with code $($renderProcess.ExitCode)"
          }

      - name: Smoke-test macOS executable
        if: runner.os == 'macOS'
        run: |
          test "$(dist/PeakPo.app/Contents/MacOS/PeakPo --version)" = "${{ steps.version.outputs.value }}"
          dist/PeakPo.app/Contents/MacOS/PeakPo --verify-rendering
          dist/PeakPo.app/Contents/MacOS/PeakPo --verify-warning-dialog
          nav_test_dir="${RUNNER_TEMP}/peakpo-navigation"
          mkdir -p "$nav_test_dir"
          cp tests/fixtures/navigation/only.chi "$nav_test_dir/"
          dist/PeakPo.app/Contents/MacOS/PeakPo \
            --verify-navigation-boundary "$nav_test_dir"

      - name: Build Linux installer
        if: runner.os == 'Linux'
        run: |
          package_root="${RUNNER_TEMP}/peakpo-deb"
          mkdir -p \
            "$package_root/DEBIAN" \
            "$package_root/usr/bin" \
            "$package_root/usr/lib/peakpo" \
            "$package_root/usr/share/applications" \
            "$package_root/usr/share/icons/hicolor/256x256/apps" \
            release
          cp -a dist/PeakPo/. "$package_root/usr/lib/peakpo/"
          install -m 0755 bundling/linux/peakpo "$package_root/usr/bin/peakpo"
          install -m 0644 bundling/linux/peakpo.desktop \
            "$package_root/usr/share/applications/peakpo.desktop"
          sed "s/@VERSION@/${{ steps.version.outputs.value }}/g" \
            bundling/linux/control.in > "$package_root/DEBIAN/control"
          python -c "from PIL import Image; Image.open('peakpo/assets/PeakPo.ico').convert('RGBA').save(r'$package_root/usr/share/icons/hicolor/256x256/apps/peakpo.png')"
          dpkg-deb --root-owner-group --build "$package_root" \
            "release/PeakPo-${{ steps.version.outputs.value }}-${{ matrix.artifact }}.deb"
          dpkg-deb --info \
            "release/PeakPo-${{ steps.version.outputs.value }}-${{ matrix.artifact }}.deb"
          extract_root="${RUNNER_TEMP}/peakpo-deb-test"
          dpkg-deb --extract \
            "release/PeakPo-${{ steps.version.outputs.value }}-${{ matrix.artifact }}.deb" \
            "$extract_root"
          test "$("$extract_root/usr/lib/peakpo/PeakPo" --version)" = \
            "${{ steps.version.outputs.value }}"

      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found"
          }
          $outputFilename = "PeakPo-${{ steps.version.outputs.value }}-${{ matrix.artifact }}-setup"
          $isccArgs = @(
            '/DMyAppVersion="${{ steps.version.outputs.value }}"'
            "/F$outputFilename"
            "bundling/windows/peakpo.iss"
          )
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $installer = "release/$outputFilename.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "PeakPo-installed"
          $installProcess = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "PeakPo installer exited with code $($installProcess.ExitCode)"
          }
          $appProcess = Start-Process -FilePath "$installDir/PeakPo.exe" -ArgumentList "--version" -Wait -PassThru
          if ($appProcess.ExitCode -ne 0) {
            throw "Installed PeakPo --version exited with code $($appProcess.ExitCode)"
          }
          $renderProcess = Start-Process -FilePath "$installDir/PeakPo.exe" -ArgumentList "--verify-rendering" -Wait -PassThru
          if ($renderProcess.ExitCode -ne 0) {
            throw "Installed PeakPo rendering verification exited with code $($renderProcess.ExitCode)"
          }

      - name: Build and verify macOS disk image
        if: runner.os == 'macOS'
        run: |
          dmg_root="${RUNNER_TEMP}/peakpo-dmg"
          mkdir -p "$dmg_root" release
          ditto dist/PeakPo.app "$dmg_root/PeakPo.app"
          ln -s /Applications "$dmg_root/Applications"
          dmg_path="release/PeakPo-${{ steps.version.outputs.value }}-${{ matrix.artifact }}.dmg"
          for attempt in 1 2 3; do
            if hdiutil create \
              -volname "PeakPo ${{ steps.version.outputs.value }}" \
              -srcfolder "$dmg_root" \
              -ov \
              -format UDZO \
              "$dmg_path"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          hdiutil verify "$dmg_path"

      - name: Upload standalone application
        uses: actions/upload-artifact@v7
        with:
          name: PeakPo-${{ steps.version.outputs.value }}-${{ matrix.artifact }}
          path: release/PeakPo-${{ steps.version.outputs.value }}-${{ matrix.artifact }}*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs:
      - python-distributions
      - standalone-executables
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
